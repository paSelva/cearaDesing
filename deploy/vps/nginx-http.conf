# Fase 1: só HTTP, para emitir o certificado. Substituído por nginx-https.conf depois.
# Instalado por provisionar.sh; não editar no servidor.
server {
    listen 80;
    server_name premiocearatemdesign.com.br www.premiocearatemdesign.com.br;

    access_log /var/log/nginx/premio-ceara.access.log;
    error_log /var/log/nginx/premio-ceara.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/premio-ceara-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
