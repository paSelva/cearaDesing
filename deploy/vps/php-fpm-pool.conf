; Pool exclusivo do Prêmio Ceará Tem Design (PHP 8.4). Instalado por provisionar.sh.
[premio-ceara]
user = premioceara
group = premioceara
listen = /run/php/premio-ceara.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand: sem tráfego, não ocupa memória dos outros sites. Reavaliar max_children com a
; memória livre real e com a carga esperada na votação.
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 60s
catch_workers_output = yes
security.limit_extensions = .php

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /var/www/premio-ceara/shared/storage/logs/php-fpm.log
php_admin_value[memory_limit] = 256M
; SPEC-003: um arquivo por requisição (imagem até 5 MB, PDF até 10 MB).
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
