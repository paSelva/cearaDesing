# Vhost do Prêmio Ceará Tem Design. Instalado por provisionar.sh; não editar no servidor.
# Servidor compartilhado com outros sites: sem default_server, sem "http2" no listen (valeria
# para todos os vhosts do mesmo socket no nginx 1.24), sem listen [::] (se os vizinhos só ouvem
# em IPv4, este vhost viraria o padrão do IPv6 e atenderia por eles) e sem diretivas fora de server {}.

server {
    listen 80;
    server_name premiocearatemdesign.com.br www.premiocearatemdesign.com.br;

    access_log /var/log/nginx/premio-ceara.access.log;
    error_log /var/log/nginx/premio-ceara.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/premio-ceara-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://premiocearatemdesign.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.premiocearatemdesign.com.br;

    ssl_certificate /etc/letsencrypt/live/premiocearatemdesign.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/premiocearatemdesign.com.br/privkey.pem;

    access_log /var/log/nginx/premio-ceara.access.log;
    error_log /var/log/nginx/premio-ceara.error.log;

    return 301 https://premiocearatemdesign.com.br$request_uri;
}

server {
    listen 443 ssl;
    server_name premiocearatemdesign.com.br;

    ssl_certificate /etc/letsencrypt/live/premiocearatemdesign.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/premiocearatemdesign.com.br/privkey.pem;

    root /var/www/premio-ceara/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/premio-ceara.access.log;
    error_log /var/log/nginx/premio-ceara.error.log;

    # Acima do post_max_size do PHP (12M), para o Laravel responder com a mensagem amigável.
    client_max_body_size 20m;

    # Arquivos ocultos (.htaccess, .env...) nunca são servidos.
    location ~ /\. {
        return 404;
    }

    # Assets do Vite têm hash no nome.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;
    }

    # Filament e Livewire podem servir assets por rota: sem regra por extensão aqui.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # O único PHP executável é o front controller.
    location = /index.php {
        include fastcgi_params;
        # $realpath_root resolve o link "current": a troca de release vale na hora, sem
        # recarregar o PHP-FPM e sem servir código antigo do OPcache.
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_pass unix:/run/php/premio-ceara.sock;
    }

    location ~ \.php$ {
        return 404;
    }
}
