; Limites de upload (SPEC-003): 1 arquivo por requisição — imagem até 5 MB (P6), PDF até 10 MB (P45, P54).
; ⚠️ Na HostGator, conferir/ajustar no MultiPHP INI Editor do cPanel.
upload_max_filesize = 10M
post_max_size = 12M

; Erros de PHP vão para o log, não para a resposta (o Laravel exibe os próprios erros).
; Sem isso, o aviso de POST acima do limite sai antes dos cabeçalhos e quebra o redirecionamento.
; ⚠️ Em produção, display_errors também deve estar Off.
display_errors = Off
display_startup_errors = Off
log_errors = On
